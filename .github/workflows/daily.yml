name: daily-market-data
on:
  schedule:
    - cron: "30 22 * * 0-4"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect data and build site files
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python run_daily.py
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs
          git commit -m "update $(date -u +%F)" || echo "no changes"
          git push
