name: daily-market-data
on:
  schedule:
    # 한국시간 월~금 06:07, 06:37, 07:07, 07:37, 08:07 (GitHub 예약 실행이 늦거나 빠질 때 대비).
    # 정시·30분은 GitHub 예약이 몰려 몇 시간씩 밀리므로 7분, 37분에 둔다.
    # 앞 실행이 정상으로 끝났으면 뒤 실행은 run_daily_v6.py 가 바로 끝낸다.
    - cron: "7,37 21-22 * * 0-4"
    - cron: "7 23 * * 0-4"
  workflow_dispatch:
    inputs:
      start_date:
        description: "밀린 날짜 채우기 시작일 (예 2026-11-03). 비워 두면 평소처럼 전일, 전전일만"
        required: false
        default: ""
      end_date:
        description: "채우기 종료일 (비우면 전영업일까지)"
        required: false
        default: ""
concurrency:
  group: daily-market-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt cryptography xlrd
      - name: Collect data and build site files
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          XLSX_PASSWORD: ${{ secrets.XLSX_PASSWORD }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: python run_daily_v6.py
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs
          git commit -m "update $(date -u +%F)" || echo "no changes"
          git pull --rebase
          git push
