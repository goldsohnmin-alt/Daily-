<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일일 금융지표</title>
<style>
  :root { --bg:#ffffff; --fg:#1f2430; --muted:#6b7280; --line:#e2e5ea; --head:#f3f5f8; --accent:#2c4a9a; --warn-bg:#fff4d6; --warn-fg:#7a5600; --bad-bg:#fde8e8; --bad-fg:#9b1c1c; --info-bg:#eef3ff; --info-fg:#2c3e7a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171c; --fg:#e6e8ec; --muted:#9aa1ad; --line:#2b313b; --head:#1c2129; --accent:#8fb0ff; --warn-bg:#3a2f12; --warn-fg:#f3d58a; --bad-bg:#3b1a1a; --bad-fg:#f5b5b5; --info-bg:#1b2438; --info-fg:#b9c8f0; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif; font-size:14px; line-height:1.5; }
  main { max-width:1280px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:20px; margin:0 0 4px; }
  h2 { font-size:15px; margin:18px 0 0; }
  .sub { color:var(--muted); margin-bottom:12px; }
  .box { border-radius:8px; padding:10px 14px; margin:10px 0; }
  .bad { background:var(--bad-bg); color:var(--bad-fg); }
  .bad ul, .info ul { margin:6px 0 0; padding-left:18px; }
  .info { background:var(--info-bg); color:var(--info-fg); }
  .panel { border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin:12px 0; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:12px 0; }
  .modes button, .btn, .quick { border:1px solid var(--line); background:var(--head); color:var(--fg); padding:7px 14px; border-radius:6px; cursor:pointer; font-size:14px; }
  .modes button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .quick { padding:5px 10px; font-size:13px; }
  input[type=date], input[type=password] { border:1px solid var(--line); background:var(--bg); color:var(--fg); padding:6px 8px; border-radius:6px; font-size:14px; }
  .msg { color:var(--muted); }
  .ok { color:#1a7f37; } .no { color:var(--bad-fg); }
  .wrap { overflow-x:auto; border:1px solid var(--line); border-radius:8px; margin:10px 0 24px; }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  th, td { padding:5px 9px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  th { background:var(--head); position:sticky; top:0; }
  td.l, th.l { text-align:left; }
  td.miss { background:var(--warn-bg); color:var(--warn-fg); text-align:center; }
  td.lock { color:var(--muted); text-align:center; }
  .refs { max-width:380px; }
  [hidden] { display:none !important; }
  label { display:inline-flex; gap:6px; align-items:center; }
</style>
</head>
<body>
<main>
  <h1>일일 금융지표</h1>
  <div class="sub" id="meta">불러오는 중…</div>
  <div id="info"></div>
  <div id="errors"></div>

  <div class="panel">
    <b>Term SOFR 표시</b>
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="off">
    <button class="btn" id="unlock">확인</button>
    <label class="msg"><input type="checkbox" id="remember"> 이 브라우저에 기억 (공용 PC에서는 끄세요)</label>
    <span id="pwmsg" class="msg">비밀번호를 넣으면 Term SOFR 값이 표시됩니다.</span>
  </div>

  <div class="modes">
    <button id="m-date" class="on">날짜 조회</button>
    <button id="m-range">기간 붙여넣기 (그래프1용 A~O열)</button>
  </div>

  <!-- 날짜 조회 -->
  <section id="v-date">
    <div class="bar">
      <label>날짜 <input type="date" id="d"></label>
      <button class="quick" id="d-latest">가장 최근</button>
      <button class="quick" id="d-prev">그 전 영업일</button>
      <button class="btn primary" id="copy-block">E2:V44 복사</button>
      <button class="btn" id="dl-block">엑셀 내려받기</button>
      <span class="msg" id="msg1"></span>
    </div>
    <div class="msg" id="avail"></div>
    <h2 id="ref-title">참고 지표</h2>
    <div class="wrap refs"><table id="ref"></table></div>
    <h2>채권 시가평가수익률 (5개사 평균, 단위 %)</h2>
    <div class="wrap"><table id="matrix"></table></div>
  </section>

  <!-- 기간 붙여넣기 -->
  <section id="v-range" hidden>
    <div class="bar">
      <label>시작 <input type="date" id="rs"></label>
      <label>종료 <input type="date" id="re"></label>
      <button class="quick" id="r5">최근 5영업일</button>
      <button class="quick" id="r10">최근 10영업일</button>
      <button class="quick" id="rall">저장된 전체</button>
      <button class="btn primary" id="copy-range">A:O 복사 (헤더 없음)</button>
      <button class="btn" id="dl-range">엑셀 내려받기</button>
      <span class="msg" id="msg2"></span>
    </div>
    <div class="msg">그래프1의 마지막 행 다음 줄 A열에 붙여넣으세요. 날짜는 오래된 날부터 순서대로 나옵니다.</div>
    <div class="msg" id="rnote"></div>
    <div class="wrap"><table id="rtable"></table></div>
  </section>

  <p class="msg">공개 엑셀(Term SOFR 제외): <a href="daily_data.xlsx" download>daily_data.xlsx</a></p>
</main>

<script>
let H = {};            // 날짜 -> {matrix, ref}
let META = null;       // data.json
let PRIV = null;       // 잠금 해제된 {날짜: Term SOFR} (없으면 null)
let PBLOB = null;      // private.json 원문
let curDate = null;

const MAT = ["3월","6월","9월","1년","1년6월","2년","2년6월","3년","4년","5년","7년","10년","15년","20년","30년","50년"];
const REFS = ["환율","KOSPI","다우지수","CP(91일)","CD(91일)","IRS(3Y)","CRS(3년)","Term SOFR"];
const RANGE_HEAD = ["일자","회사채(AA-) 3Y","회사채(AAA) 3Y","국채(10Y)","국채(5Y)","국채(3Y)","CP(91일)","CD(91일)","IRS-CD","IRS(3Y)","","일자","CRS(3년)","CRS-Term SOFR","Term SOFR(3개월)"];

const $ = id => document.getElementById(id);
const dates = () => Object.keys(H).sort();
const isNum = v => v !== null && v !== undefined && v !== '' && !isNaN(v);
const r5 = x => Math.round(x * 1e5) / 1e5;

/* ---------- 값 꺼내기 ---------- */
function termSofr(date) {
  if (!PRIV) return undefined;                    // 잠겨 있음
  return isNum(PRIV[date]) ? PRIV[date] : null;   // null = 값 없음
}
function refVal(date, label) {
  if (label === 'Term SOFR') { const t = termSofr(date); return t === undefined ? null : t; }
  const e = H[date]; return e && e.ref && isNum(e.ref[label]) ? e.ref[label] : null;
}
function rowFor(date) {                           // 그래프1 A~O 한 줄
  const e = H[date] || {}, m = e.matrix;
  const p = e.pts || {};                          // 직접 넣은 칸(채권 표가 없는 과거 날짜)이 있으면 우선
  const g = (i, j, lab) => isNum(p[lab]) ? p[lab] : (m && m[i] && isNum(m[i][j])) ? m[i][j] : '';
  const cp = refVal(date, 'CP(91일)'), cd = refVal(date, 'CD(91일)'), irs = refVal(date, 'IRS(3Y)'), crs = refVal(date, 'CRS(3년)');
  const ts = refVal(date, 'Term SOFR');
  const sub = (a, b) => (isNum(a) && isNum(b)) ? r5(a - b) : '';
  const v = x => isNum(x) ? x : '';
  return [date, g(31,7,'회사채(AA-) 3Y'), g(28,7,'회사채(AAA) 3Y'), g(0,11,'국채(10Y)'), g(0,9,'국채(5Y)'), g(0,7,'국채(3Y)'),v(cp), v(cd), sub(irs, cd), v(irs), '', date, v(crs), sub(crs, ts), v(ts)];
}

/* ---------- 복사 / 내려받기 ---------- */
async function copyText(text, msgEl, okText) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } finally { document.body.removeChild(ta); }
  }
  msgEl.textContent = okText;
}
const serial = ymd => { const [y, m, d] = ymd.split('-').map(Number); return (Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 86400000; };
function csvEsc(c) { c = c === null || c === undefined ? '' : String(c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => res(window.XLSX); s.onerror = () => rej(new Error('xlsx 라이브러리 로드 실패'));
    document.head.appendChild(s);
  });
}
// aoa 안의 날짜는 {d:'YYYY-MM-DD'} 객체로 넣으면 엑셀 날짜 셀로 저장된다
async function saveAOA(aoa, sheet, filename, msgEl) {
  try {
    const X = await loadXLSX();
    const rows = aoa.map(r => r.map(c => (c && typeof c === 'object' && c.d) ? { t: 'n', v: serial(c.d), z: 'yyyy-mm-dd' } : c));
    const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(rows), sheet);
    X.writeFile(wb, filename + '.xlsx'); msgEl.textContent = '내려받았어요: ' + filename + '.xlsx';
  } catch (e) {
    const csv = '\ufeff' + aoa.map(r => r.map(c => csvEsc(c && c.d ? c.d : c)).join(',')).join('\r\n');
    download(new Blob([csv], { type: 'text/csv;charset=utf-8' }), filename + '.csv');
    msgEl.textContent = '엑셀 도구를 못 불러와 CSV로 저장했어요(엑셀에서 바로 열립니다).';
  }
}

/* ---------- 날짜 조회 ---------- */
function blockTSV(date) {                         // 전일 시트 E2:V44 (E~T 16열 + U 라벨 + V 값)
  const e = H[date], lines = [];
  for (let r = 0; r < 43; r++) {
    const cells = (e.matrix ? e.matrix[r] : Array(16).fill(null)).map(v => isNum(v) ? String(v) : '-');
    if (r < REFS.length) { const v = refVal(date, REFS[r]); cells.push(REFS[r], v === null ? '' : String(v)); }
    else cells.push('', '');
    lines.push(cells.join('\t'));
  }
  return lines.join('\n');
}
function blockAOA(date) {                         // 전일 시트와 같은 셀 위치의 엑셀용
  const e = H[date], lab = META.row_labels, out = [];
  out.push(['종류', '종류명', '신용등급', '고시기관'].concat(MAT, ['기준일 ' + date, '']));
  for (let r = 0; r < 43; r++) {
    const row = [lab[r][0], lab[r][1], lab[r][2], '민평평균'];
    const m = e.matrix ? e.matrix[r] : Array(16).fill(null);
    m.forEach(v => row.push(isNum(v) ? v : '-'));
    if (r < REFS.length) { const v = refVal(date, REFS[r]); row.push(REFS[r], v === null ? '' : v); } else row.push('', '');
    out.push(row);
  }
  return out;
}
function renderDate() {
  const date = curDate, e = H[date];
  const box = $('copy-block'), dl = $('dl-block');
  if (!date || !e) {
    $('ref-title').textContent = '참고 지표';
    $('ref').innerHTML = ''; $('matrix').innerHTML = '';
    $('msg1').textContent = date ? date + ' 은(는) 저장된 날짜가 아니에요.' : '';
    box.disabled = dl.disabled = true; return;
  }
  $('msg1').textContent = '';
  $('ref-title').textContent = '참고 지표 (기준일 ' + date + ')';
  $('ref').innerHTML = REFS.map(l => {
    if (l === 'Term SOFR') {
      const t = termSofr(date);
      if (t === undefined) return '<tr><td class="l">' + l + '</td><td class="lock">비밀번호 입력 시 표시</td></tr>';
      return '<tr><td class="l">' + l + '</td>' + (t === null ? '<td class="miss">미수집</td>' : '<td>' + t + '</td>') + '</tr>';
    }
    const v = refVal(date, l);
    return '<tr><td class="l">' + l + '</td>' + (v === null ? '<td class="miss">미수집</td>' : '<td>' + v + '</td>') + '</tr>';
  }).join('');
  let h = '<tr><th class="l">종류</th><th class="l">종류명</th><th class="l">신용등급</th>' + MAT.map(m => '<th>' + m + '</th>').join('') + '</tr>';
  if (!e.matrix) h += '<tr><td class="miss" colspan="19">이 날짜의 채권 표는 저장돼 있지 않아요</td></tr>';
  else e.matrix.forEach((row, i) => {
    const lab = META.row_labels[i];
    h += '<tr><td class="l">' + lab[0] + '</td><td class="l">' + lab[1] + '</td><td class="l">' + lab[2] + '</td>' + row.map(v => '<td>' + (isNum(v) ? v : '-') + '</td>').join('') + '</tr>';
  });
  $('matrix').innerHTML = h;
  box.disabled = dl.disabled = !e.matrix;
}
function setDate(d) { curDate = d; $('d').value = d || ''; renderDate(); }

/* ---------- 기간 붙여넣기 ---------- */
function rangeDates() {
  const s = $('rs').value, e = $('re').value;
  return dates().filter(d => (!s || d >= s) && (!e || d <= e));
}
function renderRange() {
  const ds = rangeDates(), rows = ds.map(rowFor);
  let h = '<tr>' + RANGE_HEAD.map((c, i) => '<th' + (i === 0 || i === 11 ? ' class="l"' : '') + '>' + c + '</th>').join('') + '</tr>';
  const lockedNote = PRIV ? '' : ' (Term SOFR와 CRS-Term SOFR 칸은 비밀번호를 넣으면 채워져요)';
  const miss = [];
  rows.forEach((r, k) => {
    h += '<tr>' + r.map((c, i) => {
      const need = (i >= 1 && i <= 9) || i === 12;
      if (c === '' && need) { miss.push(ds[k]); return '<td class="miss">-</td>'; }
      if (c === '' && (i === 13 || i === 14)) return '<td class="' + (PRIV ? 'miss' : 'lock') + '">' + (PRIV ? '-' : '🔒') + '</td>';
      return '<td' + (i === 0 || i === 11 ? ' class="l"' : '') + '>' + c + '</td>';
    }).join('') + '</tr>';
  });
  $('rtable').innerHTML = h;
  const uniq = [...new Set(miss)];
  $('rnote').textContent = ds.length + '영업일' + lockedNote + (uniq.length ? ' · 빈 칸이 있는 날짜: ' + uniq.join(', ') : '');
  $('copy-range').disabled = $('dl-range').disabled = ds.length === 0;
}
function rangeTSV() { return rangeDates().map(rowFor).map(r => r.map(c => c === '' ? '' : String(c)).join('\t')).join('\n'); }
function rangeAOA() {
  const out = [RANGE_HEAD.slice()];
  rangeDates().map(rowFor).forEach(r => out.push(r.map((c, i) => (i === 0 || i === 11) ? { d: c } : c)));
  return out;
}
function quickRange(n) {
  const ds = dates(); if (!ds.length) return;
  const sel = n ? ds.slice(-n) : ds;
  $('rs').value = sel[0]; $('re').value = sel[sel.length - 1]; renderRange();
}

/* ---------- 비밀번호 / 잠금 해제 ---------- */
async function decryptPrivate(blob, pw) {
  const enc = new TextEncoder(), b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const keyMat = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(blob.salt), iterations: blob.iter, hash: 'SHA-256' },
    keyMat, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(blob.iv) }, key, b64(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlock(pw, silent) {
  const msg = $('pwmsg');
  if (!pw) { msg.textContent = '비밀번호를 입력해 주세요.'; msg.className = 'msg'; return; }
  if (!PBLOB) { msg.textContent = '잠금 데이터가 아직 없어요(Term SOFR가 한 번도 저장되지 않음).'; msg.className = 'no'; return; }
  if (!(window.crypto && window.crypto.subtle)) {
    msg.textContent = '이 브라우저(또는 주소)에서는 비밀번호 해제를 쓸 수 없어요. https:// 로 시작하는 주소로 접속했는지 확인해 주세요.'; msg.className = 'no'; return;
  }
  try {
    PRIV = await decryptPrivate(PBLOB, pw);
    msg.textContent = '확인됨 · Term SOFR ' + Object.keys(PRIV).length + '일치 표시 중'; msg.className = 'ok';
    try { if ($('remember').checked) localStorage.setItem('pw', pw); } catch (e) {}
    renderDate(); renderRange();
  } catch (e) {
    PRIV = null;
    if (e && e.name === 'OperationError') {
      msg.textContent = '비밀번호가 맞지 않아요.'; msg.className = 'no';
      try { localStorage.removeItem('pw'); } catch (e2) {}
    } else {
      msg.textContent = '해제 중 오류가 났어요(' + (e && e.name) + '). 다른 브라우저로 시도해 보세요.'; msg.className = 'no';
    }
    if (!silent) { renderDate(); renderRange(); }
  }
}

/* ---------- 시작 ---------- */
function setMode(m) {
  $('m-date').classList.toggle('on', m === 'date'); $('m-range').classList.toggle('on', m === 'range');
  $('v-date').hidden = m !== 'date'; $('v-range').hidden = m !== 'range';
}
async function getJSON(url, optional) {
  const r = await fetch(url + '?_=' + Date.now());
  if (!r.ok) { if (optional) return null; throw new Error(url + ' ' + r.status); }
  return r.json();
}
async function init() {
  try {
    [META, H] = await Promise.all([getJSON('data.json'), getJSON('history.json')]);
    PBLOB = await getJSON('private.json', true).catch(() => null);
  } catch (e) {
    $('meta').textContent = '아직 데이터가 없습니다. GitHub의 Actions 탭에서 한 번 실행해 주세요.'; return;
  }
  const ds = dates();
  $('meta').textContent = '수집 시각 ' + META.generated_at + ' (KST) · 저장된 날짜 ' + ds.length + '일 (' + (ds[0] || '-') + ' ~ ' + (ds[ds.length - 1] || '-') + ')';
  $('avail').textContent = '저장된 날짜만 조회됩니다. 없는 날짜는 GitHub Actions → Run workflow 에서 시작일·종료일을 넣어 채울 수 있어요.';
  const notes = META.errors.filter(e => e.startsWith('[안내]')), bad = META.errors.filter(e => !e.startsWith('[안내]'));
  if (notes.length) { $('info').className = 'box info'; $('info').innerHTML = '<ul>' + notes.map(e => '<li>' + e.replace(/</g, '&lt;') + '</li>').join('') + '</ul>'; }
  if (bad.length) {
    $('errors').className = 'box bad';
    $('errors').innerHTML = '<b>일부 항목을 가져오지 못했습니다.</b> "미수집" 칸은 직접 확인해 주세요.<ul>' + bad.map(e => '<li>' + e.replace(/</g, '&lt;') + '</li>').join('') + '</ul>';
  }
  if (ds.length) { $('d').min = ds[0]; $('d').max = ds[ds.length - 1]; }
  $('d').addEventListener('change', () => setDate($('d').value));
  $('d-latest').onclick = () => { const x = dates(); setDate(x[x.length - 1]); };
  $('d-prev').onclick = () => { const x = dates(), i = x.indexOf(curDate); if (i > 0) setDate(x[i - 1]); };
  $('copy-block').onclick = () => copyText(blockTSV(curDate), $('msg1'), '복사됨. 엑셀 전일 시트 E2 셀에 붙여넣기 하세요.');
  $('dl-block').onclick = () => saveAOA(blockAOA(curDate), '전일', '지표_' + curDate, $('msg1'));
  $('rs').addEventListener('change', renderRange); $('re').addEventListener('change', renderRange);
  $('r5').onclick = () => quickRange(5); $('r10').onclick = () => quickRange(10); $('rall').onclick = () => quickRange(0);
  $('copy-range').onclick = () => copyText(rangeTSV(), $('msg2'), '복사됨. 그래프1 마지막 행 다음 줄 A열에 붙여넣기 하세요.');
  $('dl-range').onclick = () => { const x = rangeDates(); saveAOA(rangeAOA(), '그래프1_붙여넣기', '그래프1_' + x[0] + '_' + x[x.length - 1], $('msg2')); };
  $('m-date').onclick = () => setMode('date'); $('m-range').onclick = () => setMode('range');
  $('unlock').onclick = () => unlock($('pw').value.trim(), false);
  $('pw').addEventListener('keydown', ev => { if (ev.key === 'Enter') unlock($('pw').value.trim(), false); });
  setDate(ds[ds.length - 1]); quickRange(5);
  try { const saved = localStorage.getItem('pw'); if (saved) { $('pw').value = saved; $('remember').checked = true; unlock(saved, true); } } catch (e) {}
}
init();
</script>
</body>
</html>
